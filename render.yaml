services:
  - type: web
    name: pusula-destek
    runtime: ruby
    plan: free
    region: frankfurt
    buildCommand: bash bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: BUNDLE_WITHOUT
        value: development:test
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pusula-db
          property: connectionString
databases:
  - name: pusula-db
    plan: free
    region: frankfurt
